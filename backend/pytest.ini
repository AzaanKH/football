[pytest]
# Pytest configuration for Fantasy Football Data Pipeline Tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categories
markers =
    unit: Unit tests with mocked dependencies (fast, no external calls)
    integration: Integration tests with real API calls (slower, needs internet)
    e2e: End-to-end tests with real API and database (slowest, needs Docker)
    slow: Tests that take a long time to run

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Async mode for pytest-asyncio
asyncio_mode = auto

# Coverage settings (when using --cov)
# Run with: pytest --cov=data_pipeline --cov-report=html

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Timeout for tests (seconds)
timeout = 60
