name: CI

on:
  # Every PR, including stacked PRs that target another branch
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -m unit

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/fantasy-football
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/fantasy-football/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          CI: true
      - run: npm run build

  schema:
    name: Fresh database schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: football_ci
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: football_ci
    steps:
      - uses: actions/checkout@v7
      - name: Create the schema on an empty database (as docker-compose does)
        run: psql -v ON_ERROR_STOP=1 -q -f backend/init_db.sql
      - name: Migrations apply cleanly on top of a fresh schema
        run: |
          for migration in backend/migrations/*.sql; do
            echo "$migration"
            psql -v ON_ERROR_STOP=1 -q -f "$migration"
          done
      - name: init_db.sql is safe to re-run
        run: psql -v ON_ERROR_STOP=1 -q -f backend/init_db.sql
